<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas 9C Realtime</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    display:flex;
    background:linear-gradient(135deg,#007bff,#00c6ff);
    transition:0.4s;
}

body.dark{
    background:linear-gradient(135deg,#121212,#1f1f1f);
    color:white;
}

.sidebar{
    width:230px;
    height:100vh;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    padding:20px;
    color:white;
}

.sidebar h2{margin-bottom:20px;}
.sidebar button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.3);
    color:white;
    cursor:pointer;
}

.main{flex:1;padding:30px;}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    animation:fade 0.7s ease;
}

body.dark .card{background:#2b2b2b;}

@keyframes fade{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* Calendar */
.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.day-name{
    font-weight:bold;
    text-align:center;
}

.calendar div{
    padding:12px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
    background:#f1f1f1;
    transition:0.3s;
}

.calendar div:hover{
    background:#007bff;
    color:white;
}

.today{
    background:#28a745 !important;
    color:white;
}

.selected{
    background:#007bff !important;
    color:white;
}

body.dark .calendar div{background:#3a3a3a;}

.absen-box{
    max-height:200px;
    overflow-y:auto;
    margin-top:10px;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    cursor:pointer;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Kelas 9C</h2>
    <div id="clock" style="margin-bottom:15px;"></div>
    <button onclick="toggleDark()">🌙 Dark Mode</button>
</div>

<div class="main">

<div class="card">
    <div class="calendar-header">
        <button onclick="prevMonth()">◀</button>
        <h3 id="monthYear"></h3>
        <button onclick="nextMonth()">▶</button>
    </div>
    <div class="calendar" id="calendar"></div>
</div>

<div class="card">
    <h3>📊 Grafik Kehadiran</h3>
    <canvas id="chart"></canvas>
</div>

<div class="card">
    <h3>📝 Input Kehadiran</h3>
    <div class="absen-box" id="formAbsen"></div>
    <button onclick="simpanAbsen()">Simpan Kehadiran</button>
</div>

</div>

<script>
const totalSiswa = 33;
let currentDate = new Date();
let selectedDate = new Date();

const monthYear = document.getElementById("monthYear");
const calendar = document.getElementById("calendar");

const dayNames = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function renderCalendar(){
    calendar.innerHTML="";

    dayNames.forEach(d=>{
        calendar.innerHTML+=`<div class="day-name">${d}</div>`;
    });

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthYear.innerText = monthNames[month] + " " + year;

    const firstDay = new Date(year,month,1).getDay();
    const daysInMonth = new Date(year,month+1,0).getDate();

    let start = (firstDay===0?6:firstDay-1);

    for(let i=0;i<start;i++){
        calendar.innerHTML += `<div></div>`;
    }

    for(let day=1;day<=daysInMonth;day++){
        let date = new Date(year,month,day);
        let className="";

        if(date.toDateString()===new Date().toDateString()){
            className="today";
        }

        if(date.toDateString()===selectedDate.toDateString()){
            className="selected";
        }

        calendar.innerHTML += 
        `<div class="${className}" onclick="selectDate(${day})">${day}</div>`;
    }
}

function selectDate(day){
    selectedDate = new Date(currentDate.getFullYear(),currentDate.getMonth(),day);
    renderCalendar();
    loadAbsen();
    updateChart();
}

function prevMonth(){
    currentDate.setMonth(currentDate.getMonth()-1);
    renderCalendar();
}

function nextMonth(){
    currentDate.setMonth(currentDate.getMonth()+1);
    renderCalendar();
}

// Realtime Clock
setInterval(()=>{
    document.getElementById("clock").innerText =
        new Date().toLocaleString();
},1000);

// Checkbox Generate
const formAbsen = document.getElementById("formAbsen");
for(let i=1;i<=totalSiswa;i++){
    formAbsen.innerHTML+=
    `<label><input type="checkbox" value="${i}" class="absen"> Siswa ${i}</label><br>`;
}

function simpanAbsen(){
    let data=[];
    document.querySelectorAll(".absen:checked").forEach(cb=>{
        data.push(cb.value);
    });
    localStorage.setItem(selectedDate.toDateString(),JSON.stringify(data));
    updateChart();
}

function loadAbsen(){
    let data = JSON.parse(localStorage.getItem(selectedDate.toDateString())) || [];
    document.querySelectorAll(".absen").forEach(cb=>{
        cb.checked = data.includes(cb.value);
    });
}

const ctx = document.getElementById("chart").getContext("2d");
let chart = new Chart(ctx,{
    type:"doughnut",
    data:{
        labels:["Hadir","Tidak Hadir"],
        datasets:[{
            data:[33,0],
            backgroundColor:["#28a745","#dc3545"]
        }]
    },
    options:{animation:{duration:1000}}
});

function updateChart(){
    let data = JSON.parse(localStorage.getItem(selectedDate.toDateString())) || [];
    chart.data.datasets[0].data = [totalSiswa-data.length,data.length];
    chart.update();
}

function toggleDark(){
    document.body.classList.toggle("dark");
}

renderCalendar();
loadAbsen();
updateChart();
</script>

</body>
</html>
